<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bridge Share Keygen</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p>BRIDGE SHARE KEYGEN</p>
        <h1>License Keygen</h1>
      </section>

      <section class="panel">
        <label for="machineCode">Customer machine code</label>
        <input id="machineCode" placeholder="Example: ABCDEF-123456-789ABC-DEF123-456789" />

        <label for="customer">Customer name</label>
        <input id="customer" placeholder="Example: Customer or company name" />

        <div class="split">
          <div>
            <label>License term</label>
            <button id="pickDate" class="date-button" type="button">Choose expiration date</button>
            <input id="expiresAt" type="hidden" />
          </div>
          <label class="check">
            <input id="permanent" type="checkbox" checked />
            <span>Permanent license</span>
          </label>
        </div>
        <p id="expiryPreview" class="expiry-preview">Current: permanent license</p>

        <div class="actions">
          <button id="generate">Generate code</button>
          <button id="clear" class="ghost">Clear</button>
        </div>

        <label for="licenseKey">Registration code</label>
        <textarea id="licenseKey" readonly placeholder="Generated code will appear here"></textarea>

        <div class="actions">
          <button id="copy">Copy code</button>
        </div>
        <p id="message"></p>
      </section>
    </main>

    <div id="dateDialog" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-panel">
        <h2>Choose expiration date</h2>
        <input id="modalDate" type="date" />
        <div class="actions modal-actions">
          <button id="confirmDate" type="button">Apply</button>
          <button id="cancelDate" class="ghost" type="button">Cancel</button>
        </div>
      </div>
    </div>
    <script src="./renderer.js"></script>
  </body>
</html>
